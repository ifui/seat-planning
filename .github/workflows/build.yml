name: Tauri v1 构建

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Windows 10 / 11 x64（新工具链，体积与性能最优）
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64-modern

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖并构建
        # 仓库根目录的 rust-toolchain.toml 固定了 1.77.2（Win7 兼容），
        # 这里显式覆盖为 stable，产出 Win10/11 专用包
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          npm ci
          npm run tauri build

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-build
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          compression-level: 0

  # Windows 7 / 8.x 兼容包（rustc 1.77.2 是最后支持 Win7 的工具链）
  build-windows-x64-win7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链（1.77.2）
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.77.2

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64-win7

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖并构建
        run: |
          npm ci
          npm run tauri build

      - name: 重命名产物（避免与 Win10/11 包同名）
        shell: pwsh
        run: |
          $nsis = 'src-tauri/target/release/bundle/nsis'
          Get-ChildItem $nsis -Filter *-setup.exe | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $nsis ($_.Name -replace '-setup\.exe$', '-win7-setup.exe'))
          }
          $msi = 'src-tauri/target/release/bundle/msi'
          Get-ChildItem $msi -Filter *.msi | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $msi ($_.Name -replace '_en-US\.msi$', '_en-US-win7.msi'))
          }

      - name: 上传 Win7 兼容产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-win7-build
          path: |
            src-tauri/target/release/bundle/msi/*-win7.msi
            src-tauri/target/release/bundle/nsis/*-win7-setup.exe
          compression-level: 0

  # macOS 通用包（Apple Silicon + Intel）；不签名、不公证
  build-macos-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-universal

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖并构建
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          npm ci
          npm run tauri build -- --target universal-apple-darwin

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-build
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          compression-level: 0

  # Linux x64
  build-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-x64

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖并构建
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          npm ci
          npm run tauri build

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-build
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          compression-level: 0

  # Linux ARM64（原生 arm64 runner；容器锁在旧发行版上，产物 glibc 要求更低）
  build-linux-arm64:
    runs-on: ubuntu-22.04-arm
    container:
      image: arm64v8/ubuntu:20.04
      options: --privileged
    steps:
      # 容器里没有任何预装工具，actions/checkout 依赖 git，必须先装
      - name: 预装 git
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust 工具链（1.77.2，以 rust-toolchain.toml 为准）
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.77.2

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-arm64

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖并构建
        run: |
          npm ci
          npm run tauri build

      - name: 上传 Linux ARM64 产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-build
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          compression-level: 0

  # 发布 Release
  release:
    runs-on: ubuntu-latest
    needs:
      [
        build-windows-x64,
        build-windows-x64-win7,
        build-macos-universal,
        build-linux-x64,
        build-linux-arm64,
      ]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: ./

      - name: 查看文件结构
        run: ls -R

      - name: 获取版本号
        run: echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").package.version')" >> $GITHUB_ENV

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ env.APP_VERSION }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🪑 座位编排 v${{ env.APP_VERSION }}
            本地离线的会议座位编排工具 | Tauri v1 构建

            ### 🖥️ 发布包
            - `windows-x64`：Windows 10 / 11 安装包（`.exe` / `.msi`）
            - `windows-x64-win7`：Windows 7 / 8.x 兼容安装包（需已安装 WebView2 109 与 VC++ 运行库）
            - macOS 通用：`.dmg`（Apple Silicon + Intel，未签名）
            - Linux x64：`.deb` / `.AppImage`
            - Linux ARM64：`.deb` / `.AppImage`

            ### 📝 更新说明
          generate_release_notes: true
          files: |
            windows-x64-build/msi/*.msi
            windows-x64-build/nsis/*.exe
            windows-x64-win7-build/msi/*-win7.msi
            windows-x64-win7-build/nsis/*-win7-setup.exe
            macos-universal-build/*.dmg
            linux-x64-build/deb/*.deb
            linux-x64-build/appimage/*.AppImage
            linux-arm64-build/deb/*.deb
            linux-arm64-build/appimage/*.AppImage
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
