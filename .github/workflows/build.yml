name: Tauri v1 构建

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Windows 10 / 11 x64（新工具链，体积与性能最优）
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64-modern

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖并构建
        # 仓库根目录的 rust-toolchain.toml 固定了 1.77.2（Win7 兼容），
        # 这里显式覆盖为 stable，产出 Win10/11 专用包
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          npm ci
          npm run tauri build

      - name: 读取版本号
        shell: pwsh
        run: |
          $v = node -p "require('./src-tauri/tauri.conf.json').package.version"
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      # 每个安装包单独一个 artifact，名称即最终文件名
      - name: 规整产物名
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist-artifacts -Force | Out-Null
          Copy-Item src-tauri/target/release/bundle/msi/*.msi "dist-artifacts/SeatPlanning_$($env:APP_VERSION)_windows-x64.msi"
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe "dist-artifacts/SeatPlanning_$($env:APP_VERSION)_windows-x64-setup.exe"
          Get-ChildItem dist-artifacts | Select-Object Name, Length

      - name: 上传 Windows x64 MSI
        uses: actions/upload-artifact@v4
        with:
          name: SeatPlanning_${{ env.APP_VERSION }}_windows-x64.msi
          path: dist-artifacts/SeatPlanning_${{ env.APP_VERSION }}_windows-x64.msi
          compression-level: 0

      - name: 上传 Windows x64 安装包
        uses: actions/upload-artifact@v4
        with:
          name: SeatPlanning_${{ env.APP_VERSION }}_windows-x64-setup.exe
          path: dist-artifacts/SeatPlanning_${{ env.APP_VERSION }}_windows-x64-setup.exe
          compression-level: 0

  # Windows 7 / 8.x 兼容包（rustc 1.77.2 是最后支持 Win7 的工具链）
  build-windows-x64-win7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链（1.77.2）
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.77.2

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64-win7

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖并构建
        run: |
          npm ci
          npm run tauri build

      - name: 读取版本号
        shell: pwsh
        run: |
          $v = node -p "require('./src-tauri/tauri.conf.json').package.version"
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: 规整产物名
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist-artifacts -Force | Out-Null
          Copy-Item src-tauri/target/release/bundle/msi/*.msi "dist-artifacts/SeatPlanning_$($env:APP_VERSION)_windows-x64-win7.msi"
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe "dist-artifacts/SeatPlanning_$($env:APP_VERSION)_windows-x64-win7-setup.exe"
          Get-ChildItem dist-artifacts | Select-Object Name, Length

      - name: 上传 Win7 MSI
        uses: actions/upload-artifact@v4
        with:
          name: SeatPlanning_${{ env.APP_VERSION }}_windows-x64-win7.msi
          path: dist-artifacts/SeatPlanning_${{ env.APP_VERSION }}_windows-x64-win7.msi
          compression-level: 0

      - name: 上传 Win7 安装包
        uses: actions/upload-artifact@v4
        with:
          name: SeatPlanning_${{ env.APP_VERSION }}_windows-x64-win7-setup.exe
          path: dist-artifacts/SeatPlanning_${{ env.APP_VERSION }}_windows-x64-win7-setup.exe
          compression-level: 0

  # macOS 通用包（Apple Silicon + Intel）；不签名、不公证
  build-macos-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-universal

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖并构建
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          npm ci
          npm run tauri build -- --target universal-apple-darwin

      - name: 读取版本号
        run: echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").package.version')" >> $GITHUB_ENV

      - name: 规整产物名
        run: |
          mkdir -p dist-artifacts
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "dist-artifacts/SeatPlanning_${APP_VERSION}_macos-universal.dmg"
          ls -lh dist-artifacts

      - name: 上传 macOS 安装包
        uses: actions/upload-artifact@v4
        with:
          name: SeatPlanning_${{ env.APP_VERSION }}_macos-universal.dmg
          path: dist-artifacts/SeatPlanning_${{ env.APP_VERSION }}_macos-universal.dmg
          compression-level: 0

  # Linux x64
  build-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-x64

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖并构建
        # deb 的 Package 字段和 /usr/bin 下的可执行文件名都取自 productName，
        # Debian 只允许小写 ASCII，故 Linux 侧用英文名打包（桌面显示名由 desktopTemplate 提供中文）
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          npm ci
          npm run tauri build -- --config '{"package":{"productName":"SeatPlanning"}}'

      - name: 读取版本号
        run: echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").package.version')" >> $GITHUB_ENV

      - name: 规整产物名
        run: |
          mkdir -p dist-artifacts
          cp src-tauri/target/release/bundle/deb/*.deb "dist-artifacts/SeatPlanning_${APP_VERSION}_linux-x64.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "dist-artifacts/SeatPlanning_${APP_VERSION}_linux-x64.AppImage"
          ls -lh dist-artifacts

      - name: 上传 Linux x64 deb
        uses: actions/upload-artifact@v4
        with:
          name: SeatPlanning_${{ env.APP_VERSION }}_linux-x64.deb
          path: dist-artifacts/SeatPlanning_${{ env.APP_VERSION }}_linux-x64.deb
          compression-level: 0

      - name: 上传 Linux x64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SeatPlanning_${{ env.APP_VERSION }}_linux-x64.AppImage
          path: dist-artifacts/SeatPlanning_${{ env.APP_VERSION }}_linux-x64.AppImage
          compression-level: 0

  # Linux ARM64（原生 arm64 runner；容器锁在旧发行版上，产物 glibc 要求更低）
  build-linux-arm64:
    runs-on: ubuntu-22.04-arm
    container:
      image: arm64v8/ubuntu:20.04
      options: --privileged
    steps:
      # 容器里没有任何预装工具，actions/checkout 依赖 git，必须先装
      - name: 预装 git
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust 工具链（1.77.2，以 rust-toolchain.toml 为准）
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.77.2

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-arm64

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖并构建
        # 同 linux-x64：deb 包名必须是 ASCII，Linux 侧用英文名打包
        run: |
          npm ci
          npm run tauri build -- --config '{"package":{"productName":"SeatPlanning"}}'

      # 体积来源取证：deb 只有应用本体，AppImage = AppDir + linuxdeploy 捆绑的系统库
      - name: 产物体积明细
        run: |
          ls -lh src-tauri/target/release/bundle/deb/ src-tauri/target/release/bundle/appimage/
          dir=$(ls -d src-tauri/target/release/bundle/appimage/*.AppDir)
          du -sh "$dir"
          du -sh "$dir"/usr/bin "$dir"/usr/lib 2>/dev/null || true
          du -sh "$dir"/usr/lib/* 2>/dev/null | sort -h | tail -15

      - name: 读取版本号
        run: echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").package.version')" >> $GITHUB_ENV

      - name: 规整产物名
        run: |
          mkdir -p dist-artifacts
          cp src-tauri/target/release/bundle/deb/*.deb "dist-artifacts/SeatPlanning_${APP_VERSION}_linux-arm64.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "dist-artifacts/SeatPlanning_${APP_VERSION}_linux-arm64.AppImage"
          ls -lh dist-artifacts

      - name: 上传 Linux ARM64 deb
        uses: actions/upload-artifact@v4
        with:
          name: SeatPlanning_${{ env.APP_VERSION }}_linux-arm64.deb
          path: dist-artifacts/SeatPlanning_${{ env.APP_VERSION }}_linux-arm64.deb
          compression-level: 0

      - name: 上传 Linux ARM64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SeatPlanning_${{ env.APP_VERSION }}_linux-arm64.AppImage
          path: dist-artifacts/SeatPlanning_${{ env.APP_VERSION }}_linux-arm64.AppImage
          compression-level: 0
