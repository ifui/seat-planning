name: Tauri v1 构建

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Windows 10 / 11 x64（新工具链，体积与性能最优）
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64-modern

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖并构建
        # 仓库根目录的 rust-toolchain.toml 固定了 1.77.2（Win7 兼容），
        # 这里显式覆盖为 stable，产出 Win10/11 专用包
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          npm ci
          npm run tauri build

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-build
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          compression-level: 0

  # Windows 7 / 8.x 兼容包（rustc 1.77.2 是最后支持 Win7 的工具链）
  build-windows-x64-win7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链（1.77.2）
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.77.2

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64-win7

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖并构建
        run: |
          npm ci
          npm run tauri build

      - name: 重命名产物（避免与 Win10/11 包同名）
        shell: pwsh
        run: |
          $nsis = 'src-tauri/target/release/bundle/nsis'
          Get-ChildItem $nsis -Filter *-setup.exe | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $nsis ($_.Name -replace '-setup\.exe$', '-win7-setup.exe'))
          }
          $msi = 'src-tauri/target/release/bundle/msi'
          # MSI 文件名带语言后缀
          Get-ChildItem $msi -Filter *.msi | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $msi ($_.Name -replace '_[a-z]{2}-[A-Z]{2}\.msi$', '-win7.msi'))
          }

      - name: 上传 Win7 兼容产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-win7-build
          path: |
            src-tauri/target/release/bundle/msi/*-win7.msi
            src-tauri/target/release/bundle/nsis/*-win7-setup.exe
          compression-level: 0

  # macOS 通用包（Apple Silicon + Intel）；不签名、不公证
  build-macos-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-universal

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖并构建
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          npm ci
          npm run tauri build -- --target universal-apple-darwin

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-build
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          compression-level: 0

  # Linux x64
  build-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-x64

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖并构建
        # deb 的 Package 字段和 /usr/bin 下的可执行文件名都取自 productName，
        # Debian 只允许小写 ASCII，故 Linux 侧用英文名打包（桌面显示名由 desktopTemplate 提供中文）
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          npm ci
          npm run tauri build -- --config '{"package":{"productName":"SeatPlanning"}}'

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-build
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          compression-level: 0

  # Linux ARM64（原生 arm64 runner；容器锁在旧发行版上，产物 glibc 要求更低）
  build-linux-arm64:
    runs-on: ubuntu-22.04-arm
    container:
      image: arm64v8/ubuntu:20.04
      options: --privileged
    steps:
      # 容器里没有任何预装工具，actions/checkout 依赖 git，必须先装
      - name: 预装 git
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust 工具链（1.77.2，以 rust-toolchain.toml 为准）
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.77.2

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-arm64

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖并构建
        # 同 linux-x64：deb 包名必须是 ASCII，Linux 侧用英文名打包
        run: |
          npm ci
          npm run tauri build -- --config '{"package":{"productName":"SeatPlanning"}}'

      # 体积来源取证：deb 只有应用本体，AppImage = AppDir + linuxdeploy 捆绑的系统库
      - name: 产物体积明细
        run: |
          ls -lh src-tauri/target/release/bundle/deb/ src-tauri/target/release/bundle/appimage/
          dir=$(ls -d src-tauri/target/release/bundle/appimage/*.AppDir)
          du -sh "$dir"
          du -sh "$dir"/usr/bin "$dir"/usr/lib 2>/dev/null || true
          du -sh "$dir"/usr/lib/* 2>/dev/null | sort -h | tail -15

      - name: 上传 Linux ARM64 产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-build
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          compression-level: 0

  # 发布 Release
  release:
    runs-on: ubuntu-latest
    needs:
      [
        build-windows-x64,
        build-windows-x64-win7,
        build-macos-universal,
        build-linux-x64,
        build-linux-arm64,
      ]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: ./

      - name: 查看文件结构
        run: ls -R

      - name: 获取版本号
        run: echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").package.version')" >> $GITHUB_ENV

      # 统一改名为「产品_版本_平台-架构.扩展名」，逐个文件作为独立 Release 附件
      - name: 规整附件名
        run: |
          set -e
          shopt -s nullglob
          mkdir -p release
          rename_one() {
            local src=($1)
            if [ ${#src[@]} -ne 1 ]; then
              echo "::error::期望恰好 1 个文件，实际 ${#src[@]} 个：$1"
              exit 1
            fi
            cp "${src[0]}" "release/$2"
          }
          rename_one "linux-x64-build/deb/*.deb"                   "座位编排_${APP_VERSION}_linux-x64.deb"
          rename_one "linux-x64-build/appimage/*.AppImage"          "座位编排_${APP_VERSION}_linux-x64.AppImage"
          rename_one "linux-arm64-build/deb/*.deb"                  "座位编排_${APP_VERSION}_linux-arm64.deb"
          rename_one "linux-arm64-build/appimage/*.AppImage"        "座位编排_${APP_VERSION}_linux-arm64.AppImage"
          rename_one "windows-x64-build/msi/*.msi"                  "座位编排_${APP_VERSION}_windows-x64.msi"
          rename_one "windows-x64-build/nsis/*.exe"                 "座位编排_${APP_VERSION}_windows-x64-setup.exe"
          rename_one "windows-x64-win7-build/msi/*-win7.msi"        "座位编排_${APP_VERSION}_windows-x64-win7.msi"
          rename_one "windows-x64-win7-build/nsis/*-win7-setup.exe" "座位编排_${APP_VERSION}_windows-x64-win7-setup.exe"
          rename_one "macos-universal-build/*.dmg"                  "座位编排_${APP_VERSION}_macos-universal.dmg"
          ls -lh release/

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ env.APP_VERSION }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🪑 座位编排 v${{ env.APP_VERSION }}
            本地离线的会议座位编排工具 | Tauri v1 构建

            ### 🖥️ 发布包（逐个文件，按需下载）
            - `座位编排_${{ env.APP_VERSION }}_windows-x64-setup.exe` / `_windows-x64.msi`：Windows 10 / 11
            - `座位编排_${{ env.APP_VERSION }}_windows-x64-win7-setup.exe` / `_windows-x64-win7.msi`：Windows 7 / 8.x（需已安装 WebView2 109 与 VC++ 运行库）
            - `座位编排_${{ env.APP_VERSION }}_macos-universal.dmg`：macOS 通用包（Intel + Apple Silicon，未签名）
            - `座位编排_${{ env.APP_VERSION }}_linux-x64.deb` / `_linux-x64.AppImage`
            - `座位编排_${{ env.APP_VERSION }}_linux-arm64.deb` / `_linux-arm64.AppImage`

            ### 📝 更新说明
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
