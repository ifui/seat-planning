[package]
name = "seat-planning"
version = "0.1.0"
description = "座位编排系统"
authors = ["seat-planning"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "dialog-open", "dialog-save"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Tauri v1 没有官方 SQL 插件（plugins-workspace 从 v2 开始），
# 这里用 rusqlite 内置实现同样的 execute/select 语义，前端仓储接口不变。
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
